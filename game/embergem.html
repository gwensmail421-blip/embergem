<style>

.goal small{color:var(--mist);font-size:15px}
.goal.done{opacity:.45}

@keyframes gb{40%{color:var(--gold-hi);text-shadow:0 0 10px var(--gold)}}

// ---------- daily gift: a small present each day; a missed day just lets the streak sleep ----------
function dailyGift(){
  const day=d=>new Date(d).toISOString().slice(0,10),today=day(Date.now());if(store.lastGift===today)return;
  const streak=Math.min(7,(store.giftStreak||0)+1),n=4+streak;store.giftStreak=streak;store.lastGift=today;store.embers=(store.embers||0)+n;save();boostUI();
  if(!store.tutored)return;
  const v=$("veil");v.hidden=false;
  v.innerHTML=`<div class="card"><h2>A gift from the dragon</h2><div class="big">+${n} ✦</div><p>Day ${streak} of 7. Come back tomorrow for a bigger one.<br>Missed days never break it.</p><button id="take" type="button">Take it</button></div>`;
  $("take").onclick=()=>{v.hidden=true;sound.vein();haptic.success()};
}
function setMode(m){mode=m;store.mode=m;save();$("modes").hidden=true;newGame()}
$("modeBtn").onclick=()=>{const d=store.daily&&store.daily[todayKey()],st=dragonStage();
  $("mDaily").innerHTML=`Daily #${dailyNo()}<small>${d?`${"★".repeat(d.stars)} in ${d.moves} moves · done`:"Same chamber for everyone today"}</small>`;
  $("mChamb").innerHTML=`Chambers<small>Chamber ${roman(store.level||lvl)} · calm, no ending</small>`;
  $("mEndless").innerHTML=`Endless<small>Best ${(store.best||0).toLocaleString()} · scored like other block games</small>`;
  $("dragonAge").textContent=`Your dragon: ${st.name}. ${(store.hoardTotal||0).toLocaleString()} gems gathered${st.next?`, ${st.next.toLocaleString()} to grow`:""}.`;
  $("lbBtn").hidden=!gc.available();$("modes").hidden=false};
$("mDaily").onclick=()=>setMode("daily");$("dailyNudge").onclick=()=>setMode("daily");$("mChamb").onclick=()=>{lvl=store.level||lvl;setMode("chambers")};$("mEndless").onclick=()=>setMode("endless");
$("closeModes").onclick=()=>{$("modes").hidden=true};$("lbBtn").onclick=()=>gc.show();
$("restart").onclick=newGame;
$("settingsBtn").onclick=()=>{$("shopMsg").textContent="";renderSkins();monet.refresh();$("settings").hidden=false};
$("closeSet").onclick=()=>{$("settings").hidden=true};
$("noads").onclick=()=>monet.buy();$("restore").onclick=()=>monet.restore();$("privacy").onclick=()=>monet.privacy();
$("sound").onclick=()=>{store.sound=!store.sound;save();monet.mute(!store.sound);$("sound").textContent=store.sound?"Sound on":"Sound off";if(store.sound){sound.unlock();sound.test();setTimeout(()=>{$("foot").textContent=`Sound check: ${sound.state()}. You should hear a soft chime.`},350)}};
$("sound").textContent=store.sound?"Sound on":"Sound off";
$("haptics").onclick=haptic.during(()=>{store.haptics=!store.haptics;save();$("haptics").textContent=store.haptics?"Haptics on":"Haptics off";if(store.haptics){haptic.burst();$("foot").textContent=haptic.native?"You should feel a few taps.":"You should feel a few taps. On iPhone this needs iOS 18 or newer."}});
$("haptics").textContent=store.haptics?"Haptics on":"Haptics off";

// ---------- ads and the Remove Ads purchase (App Store build only) ----------
// Calm by design: no ads during play. An interstitial can appear between chambers (from
// Chamber III, at most every other chamber); "Fresh pieces" is an optional rewarded ad.
// Buying Remove Ads drops the interstitials and makes Fresh pieces free (once per chamber).
// Embergem's own AdMob units on iPhone; Android keeps Google's public test IDs until it has its own AdMob app
const ADS=window.Capacitor&&window.Capacitor.getPlatform&&window.Capacitor.getPlatform()==="ios"?{
  interstitial:"ca-app-pub-3061972842166099/6560453692",
  rewarded:"ca-app-pub-3061972842166099/4457034537"}:{
  interstitial:"ca-app-pub-3940256099942544/1033173712",
  rewarded:"ca-app-pub-3940256099942544/5224354917"};
const NOADS_ID="com.embergem.app.removeads";
const monet=(()=>{
  const C=window.Capacitor,native=!!(C&&C.isNativePlatform&&C.isNativePlatform());
  const Ad=native?C.Plugins.AdMob:null,St=native&&C.getPlatform&&C.getPlatform()==="ios"?C.Plugins.Store:null,testing=ADS.interstitial.startsWith("ca-app-pub-3940256099942544");
  let started=false,interReady=false,rewardReady=false,price=null,privacyNeeded=false,sinceAd=0,busy=false;
  const noAds=()=>!!store.noAds;
  function loadInter(){if(!started||noAds())return;interReady=false;Ad.prepareInterstitial({adId:ADS.interstitial,isTesting:testing}).then(()=>{interReady=true}).catch(()=>setTimeout(loadInter,60000))}
  function loadReward(){if(!started)return;rewardReady=false;Ad.prepareRewardVideoAd({adId:ADS.rewarded,isTesting:testing}).then(()=>{rewardReady=true;refresh()}).catch(()=>setTimeout(loadReward,60000))}
  async function start(){
    if(!native)return;
    try{const o=await St.owned({id:NOADS_ID});if(o.owned!==!!store.noAds){store.noAds=o.owned;save()}}catch(e){}
    try{St.addListener("entitlement",e=>{if(e.id===NOADS_ID){store.noAds=e.owned;save();refresh()}})}catch(e){}
    try{const p=await St.product({id:NOADS_ID});if(p.available)price=p.price}catch(e){}
    try{const info=await Ad.requestConsentInfo();if(info.isConsentFormAvailable&&info.status==="REQUIRED")await Ad.showConsentForm();
      privacyNeeded=info.privacyOptionsRequirementStatus==="REQUIRED";if(info.canRequestAds===false){refresh();return}}catch(e){}
    try{await Ad.initialize({initializeForTesting:testing});started=true;Ad.setApplicationMuted({muted:!store.sound}).catch(()=>{});loadInter();loadReward()}catch(e){}
    refresh();
  }
  function refresh(){
    boostUI();
    $("shop").hidden=!native||!St;$("privacy").hidden=!privacyNeeded;
    $("noads").disabled=noAds()||!price;$("noads").textContent=noAds()?"Ads removed. Thank you!":price?`Remove ads · ${price}`:"Remove ads";
  }
  async function between(next){
    sinceAd++;
    if(!started||noAds()||!interReady||(mode==="chambers"&&lvl<2)||sinceAd<(mode==="endless"?3:2))return next();
    try{const t=await Ad.trackingAuthorizationStatus();if(t.status==="notDetermined")await Ad.requestTrackingAuthorization()}catch(e){}
    let done=false;const go=()=>{if(done)return;done=true;sinceAd=0;loadInter();next()};
    let h;try{h=await Ad.addListener("interstitialAdDismissed",()=>{h&&h.remove();go()})}catch(e){}
    Ad.showInterstitial().catch(()=>{h&&h.remove();go()});
  }
  // noAds buyers get the reward straight away, no ad
  async function rewarded(reward){
    if(busy)return;if(noAds()){const d=new Date().toISOString().slice(0,10);if(store.freeDay!==d||(store.freeCount||0)<3){if(store.freeDay!==d){store.freeDay=d;store.freeCount=0}store.freeCount++;save();reward()}else $("foot").textContent="That's today's three free refills. More tomorrow.";return}
    if(!rewardReady)return;busy=true;let got=false;
    let h;try{h=await Ad.addListener("onRewardedVideoAdReward",()=>{got=true})}catch(e){}
    try{await Ad.showRewardVideoAd();}catch(e){}
    h&&h.remove();busy=false;loadReward();if(got)reward();refresh();
  }
  async function buy(){
    if(!St||noAds())return;$("noads").disabled=true;$("shopMsg").textContent="";
    try{const r=await St.purchase({id:NOADS_ID});if(r.owned){store.noAds=true;save();$("shopMsg").textContent="Ads removed. Thank you for supporting Embergem.";haptic.success()}
      else if(r.pending)$("shopMsg").textContent="Waiting for approval.";}
    catch(e){$("shopMsg").textContent=e&&e.message?e.message:"The purchase didn't go through."}
    refresh();
  }
  async function restore(){
    if(!St)return;$("shopMsg").textContent="Checking…";
    try{const r=await St.restore({id:NOADS_ID});store.noAds=r.owned;save();$("shopMsg").textContent=r.owned?"Restored. Ads are off.":"No earlier purchase found."}
    catch(e){$("shopMsg").textContent="Couldn't reach the App Store."}
    refresh();
  }
  function privacy(){Ad&&Ad.showPrivacyOptionsForm().catch(()=>{})}
  return{start,refresh,between,rewarded,canReward:()=>native&&(noAds()?(store.freeDay!==new Date().toISOString().slice(0,10)||(store.freeCount||0)<3):rewardReady),buy,restore,privacy,native,mute:m=>{if(started)Ad.setApplicationMuted({muted:m}).catch(()=>{})}};
})();

// ---------- Game Center leaderboards (iPhone app only) ----------
const LB={endless:"embergem.endless",chambers:"embergem.chambers",daily:"embergem.daily"};
const gc=(()=>{const C=window.Capacitor,P=C&&C.isNativePlatform&&C.isNativePlatform()&&C.getPlatform&&C.getPlatform()==="ios"&&C.Plugins.GameCenter;let ok=false;
  return{start(){if(P)P.auth().then(r=>{ok=!!r.authenticated}).catch(()=>{})},available:()=>ok,
    submit(id,value){if(ok&&value>0)P.submit({id,score:Math.round(value)}).catch(()=>{})},
    show(){if(ok)P.show({}).catch(()=>{})}}})();

// ---------- sound: glassy, low, calm ----------
const sound=(()=>{let ac,out,rev;
  const S=[220,246.94,261.63,329.63,349.23,440,493.88,523.25,659.25,698.46,880,987.77,1046.5];
  function wake(){if(ac||!store.sound)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();out=ac.createGain();out.gain.value=.8;out.connect(ac.destination);
    rev=ac.createDelay();rev.delayTime.value=.23;const fb=ac.createGain();fb.gain.value=.38;const wet=ac.createGain();wet.gain.value=.3;rev.connect(fb);fb.connect(rev);rev.connect(wet);wet.connect(out)}catch(e){ac=null}}
  function tone(f,d=.8,v=.1,type="sine",w=0){if(!ac||!store.sound)return;const t=ac.currentTime+w,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);g.connect(rev);o.start(t);o.stop(t+d+.05)}
  return{wake,    state(){return ac?ac.state:"not started"},test(){tone(523.25,.9,.12,"sine")},unlock(){try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}wake();const A=ac;try{if(!window.__sil){const a=document.createElement("audio");a.src=SIL;a.loop=true;a.setAttribute("playsinline","");a.setAttribute("x-webkit-airplay","deny");a.preload="auto";const p=a.play();if(p&&p.catch)p.catch(()=>{window.__sil=null});window.__sil=a}else if(window.__sil.paused)window.__sil.play().catch(()=>{})}catch(e){}if(!A)return;try{if(A.state!=="running")A.resume();const b=A.createBuffer(1,1,22050),s=A.createBufferSource();s.buffer=b;s.connect(A.destination);s.start(0)}catch(e){}},

    pick(){tone(660,.12,.04,"sine")},
    place(n){tone(S[Math.min(4,n)]/2,.35,.12,"triangle");tone(S[Math.min(4,n)],.5,.04,"sine",.01)},
    clear(lines,combo){const base=Math.min(combo-1,4);for(let i=0;i<2+lines*2;i++)tone(S[Math.min(S.length-1,base+i*2)],1.4,.07,"sine",i*.06);tone(110,1.2,.1,"triangle")},
    breath(o){if(!ac||!store.sound)return;const t=ac.currentTime,len=1.6,b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(),lp=ac.createBiquadFilter(),g=ac.createGain();src.buffer=b;lp.type="lowpass";lp.frequency.setValueAtTime(260+300*o,t);lp.frequency.linearRampToValueAtTime(160,t+len);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.025+.04*o,t+.9);g.gain.linearRampToValueAtTime(0,t+len);src.connect(lp);lp.connect(g);g.connect(out);src.start(t);src.stop(t+len);
      },
    shift(){[392,329.63,293.66,261.63,220].forEach((f,i)=>tone(f,1.8,.05,"sine",i*.12));tone(110,2.4,.06,"triangle")},
    done(st){[0,2,4,6,7,9,11].slice(0,4+st).forEach((k,i)=>tone(S[k],2.2,.07,"sine",i*.12));tone(110,2.6,.08,"triangle")},
    snap(w){const n=w.rows.length+w.cols.length;tone(n?880:1320,.05,.025,"sine");if(n)tone(1318.5,.18,.02,"sine",.02)},
    pop(j,pure){tone(S[Math.min(S.length-1,3+j%9)]*(pure?2:1),.5,.035,"sine")},
    tink(r){tone(1046.5+r*700,.25,.04,"triangle");tone(2093+r*900,.12,.012,"sine",.015)},
    vein(){[0,2,4,6,8,10,12].forEach((k,i)=>tone(S[k],2,.06,"sine",.1+i*.07))},
    end(){[440,349.23,293.66,220].forEach((f,i)=>tone(f,1.6,.07,"triangle",i*.18))}};
})();


// phones only allow audio once a tap has unlocked it; also ask iOS to play through the silent switch
["pointerdown","touchend","click","keydown"].forEach(ev=>addEventListener(ev,()=>sound.unlock(),{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sound.unlock()});
addEventListener("resize",layout);
applySkin();layout();newGame();requestAnimationFrame(render);monet.start();dailyGift();gc.start();
</script>
