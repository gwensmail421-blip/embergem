<style>
/* Layout: one dark screen. Gem goals above, the cavern of rock tiles coiled by the dragon as the hero, boosts below. */
:root{

}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 35%,#1a1622 0%,var(--void) 65%)}
[hidden]{display:none!important}
.app{height:100%;padding-top:max(12px,env(safe-area-inset-top))!important;padding-bottom:max(12px,env(safe-area-inset-bottom))!important;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:8px}
header{width:100%;max-width:460px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.brand{font-family:var(--display);color:var(--gold);letter-spacing:.14em;font-size:13px;align-self:center}
.chamber{text-align:center;font-family:var(--display);font-size:clamp(24px,7vw,32px);line-height:1;color:var(--bone)}
.goals{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:26px}
.goal{display:flex;align-items:center;gap:6px;font-size:19px;font-variant-numeric:tabular-nums;color:var(--bone);transition:opacity .4s}
.goal i{width:18px;height:18px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(241,220,174,.3)}
.goal small{color:var(--mist);font-size:15px}
.goal.done{opacity:.45}
.goal.done b::after{content:" ✓";color:var(--gold)}
.goal.bump b{animation:gb .4s}
@keyframes gb{40%{color:var(--gold-hi);text-shadow:0 0 10px var(--gold)}}
.stars{font-size:34px;letter-spacing:.2em;color:var(--gold)}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1}
.best{justify-self:end;text-align:right;color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
.best b{display:block;color:var(--gold);font-weight:600;font-size:18px}

.foot{color:var(--mist);font-style:italic;font-size:16px;min-height:1.3em;text-align:center}

@keyframes fade{from{opacity:0}to{opacity:1}}

.card .big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.card p{margin:0;color:var(--mist);font-size:17px}
.card p.gift{color:var(--gold-hi);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button.ghost{padding:10px 16px}
button.mode{display:flex;flex-direction:column;gap:2px;align-items:center;padding:12px 16px;border-radius:16px;background:rgba(241,220,174,.06);border:1px solid var(--rim);color:var(--bone);font-family:var(--display);font-size:20px;letter-spacing:.06em}

.card.col h2{margin-bottom:6px}

<script>
const SIL="data:audio/wav;base64,UklGRsQPAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YaAPAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIC const $=id=>document.getElementById(id),cv=$("cv"),ctx=cv.getContext("2d");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function load(){try{return JSON.parse((localStorage.getItem("embergem")||localStorage.getItem("hoard"))||"{}")}catch(e){return{}}}
function save(){try{localStorage.setItem("embergem",JSON.stringify(store))}catch(e){}}
const store=Object.assign({best:0,sound:true,haptics:true,embers:5},load());


// Jewel tones: [base, light, deep]
const GEMS=[
 {n:"garnet",c:["#8c1d3c","#e0587c","#3d0a1a"]},
 {n:"amethyst",c:["#5a2d8c","#b083e0","#24103d"]},
 {n:"emerald",c:["#17694f","#5fd1a4","#06291f"]},
 {n:"sapphire",c:["#1f437f","#6c9ae6","#0a1a36"]},
 {n:"topaz",c:["#9a6b22","#f0c56a","#3d2808"]},
 {n:"moonstone",c:["#5d6a80","#c9d4e6","#222834"]},
];
// gem skins bought with embers; every skin keeps six clearly different hues
const SKINS={
  classic:{name:"Classic",cost:0,c:GEMS.map(g=>g.c)},
  obsidian:{name:"Obsidian",cost:60,c:[["#3a0d18","#ff5c7a","#0a0306"],["#24113a","#c08cff","#07030d"],["#0c2a20","#4dffb8","#020a07"],["#0d1d3a","#6fb2ff","#02060d"],["#3a2a0d","#ffcf5c","#0d0902"],["#22262e","#e6eeff","#06070a"]]},
  bloodmoon:{name:"Blood Moon",cost:80,c:[["#7a0f14","#ff4a3d","#2a0405"],["#5c1730","#e0628a","#1f060f"],["#7a3a12","#ff9a4a","#2a1205"],["#3d0d0d","#a8433a","#140303"],["#8a6a1a","#ffd36a","#2e2306"],["#4a3a40","#c9a8b0","#1a1316"]]},
  bone:{name:"Bone",cost:80,c:[["#b8a88a","#f4ead2","#5a4e38"],["#7a6a5a","#c8b8a4","#2e261e"],["#5e6b4a","#a8b88e","#20281a"],["#5a6470","#aab4c0","#1e232a"],["#8a5a3a","#d8a07a","#3a2214"],["#3a3430","#8a8078","#141210"]]},
  frost:{name:"Frost",cost:100,c:[["#2a6a8a","#9ae6ff","#0a2836"],["#5a4a8a","#c8b8ff","#1e1836"],["#2a7a6a","#9affe0","#0a2e28"],["#14306a","#5a8aff","#060f26"],["#8a9aa8","#ffffff","#3a444e"],["#6a3a7a","#e8a8ff","#26122e"]]}};
function applySkin(){const sk=SKINS[store.skin]||SKINS.classic;GEMS.forEach((g,i)=>g.c=sk.c[i])}
function renderSkins(){
  const own=store.skins||["classic"];
  $("skins").innerHTML=Object.entries(SKINS).map(([k,sk])=>`<button class="skin${(store.skin||"classic")===k?" on":""}" data-k="${k}" type="button"><span class="sw">${sk.c.map(c=>`<i style="background:linear-gradient(${c[1]},${c[0]} 60%,${c[2]})"></i>`).join("")}</span>${sk.name}${own.includes(k)?"":`<small>✦ ${sk.cost}</small>`}</button>`).join("");
  $("skins").querySelectorAll(".skin").forEach(b=>b.onclick=()=>{const k=b.dataset.k,sk=SKINS[k];const own=store.skins||["classic"];
    if(!own.includes(k)){if((store.embers||0)<sk.cost){$("shopMsg").textContent=`${sk.name} costs ${sk.cost} embers. You have ${store.embers||0}.`;return}store.embers-=sk.cost;store.skins=[...own,k];$("shopMsg").textContent=`${sk.name} gems are yours.`;haptic.success();sound.vein()}
    store.skin=k;save();applySkin();renderSkins();renderGoals();boostUI()});
}

// ---------- haptics ----------
// Android: navigator.vibrate. iPhone (iOS 18+): Safari has no vibrate, but toggling a native
// <input switch> plays the system tap. WebKit only allows it inside a real tap/release, so
// gesture handlers wrap their work in haptic.during(); taps requested elsewhere are skipped on iPhone.
const haptic=(()=>{let live=0;const canVibe=typeof navigator.vibrate==="function";
  // inside the App Store build, Capacitor gives us the real Taptic Engine
  const nat=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.Haptics;
  function native(p,kind){const n=Array.isArray(p)?p:[p];if(kind==="success"){nat.notification({type:"SUCCESS"}).catch(()=>{});return}if(n.length>1){nat.impact({style:"MEDIUM"}).catch(()=>{});setTimeout(()=>nat.impact({style:"LIGHT"}).catch(()=>{}),90);return}nat.impact({style:n[0]<=8?"LIGHT":n[0]<=16?"MEDIUM":"HEAVY"}).catch(()=>{})}
  function ios(){try{const l=document.createElement("label");l.ariaHidden="true";l.style.display="none";const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");l.appendChild(i);document.head.appendChild(l);l.click();document.head.removeChild(l)}catch(e){}}
  function fire(p,kind){if(store.haptics===false)return;if(nat){native(p,kind);return}if(canVibe){try{navigator.vibrate(p)}catch(e){}return}
    if(!live)return;const n=Array.isArray(p)?Math.ceil(p.length/2):1;ios();for(let i=1;i<Math.min(n,3);i++)setTimeout(ios,i*120)}
  function during(fn){return function(e){live++;try{return fn.call(this,e)}finally{live--}}}
  return{fire,during,tick:()=>fire(6),tap:()=>fire(12),thud:()=>fire(22),burst:()=>fire([16,50,16,50,30]),success:()=>fire([20,60,20,60,50],"success"),supported:()=>!!nat||canVibe||"ontouchend" in window,native:!!nat};
})();
// ---------- the cavern: turn rock tiles until one ember vein joins the dragon's heart to every gem ----------
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W as [dx,dy]; a tile's veins are a 4-bit mask in that order
const rot=m=>((m<<1)|(m>>3))&15;
const rotK=(m,k)=>{for(let i=0;i<(k&3);i++)m=rot(m);return m};
const period=m=>m===5||m===10?2:m===15?1:4;
const bits=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
let N=5,tiles=[],heart=[2,2],moves=0,par=0,over=false,aiming=false,particles=[],texts=[],flashes=[],shake=0,lit=new Set(),litAt=new Map(),hinted=new Map();
let W,H,DPR,U,cell,bx,by;
function layout(){
  const st=$("stage").getBoundingClientRect();
  W=Math.min(st.width,460);H=Math.min(st.height,W*1.16);W=Math.min(W,H/1.16);
  DPR=window.devicePixelRatio||1;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U=W/9.5;bx=U*.75;by=U*1.95;cell=U*8/N;RING=null;
}
const tileAt=(x,y)=>tiles[y][x];
const maskOf=t=>rotK(t.base,t.turns);
// a random spanning tree grown from the heart; mixing depth-first and random growth gives winding veins with plenty of branches
function genCavern(n,colors,r,scr=.85,deep=.55){
  N=n;cell=U*8/N;heart=[Math.floor((n-1)/2),Math.floor(n/2)];
  const m=[...Array(n)].map(()=>Array(n).fill(0)),seen=new Set([heart+""]),open=[heart];
  while(open.length){const idx=r()<deep?open.length-1:Math.floor(r()*open.length),[x,y]=open[idx];
    const opts=[];DIRS.forEach(([dx,dy],i)=>{const a=x+dx,b=y+dy;if(a>=0&&b>=0&&a<n&&b<n&&!seen.has(a+","+b))opts.push([a,b,i])});
    if(!opts.length){open.splice(idx,1);continue}
    const[a,b,i]=opts[Math.floor(r()*opts.length)];m[y][x]|=1<<i;m[b][a]|=1<<((i+2)%4);seen.add(a+","+b);open.push([a,b])}
  tiles=m.map((row,y)=>row.map((base,x)=>{const isHeart=x===heart[0]&&y===heart[1];
    return{base,turns:0,shown:0,gem:!isHeart&&bits(base)===1?colors[Math.floor(r()*colors.length)]:-1,heart:isHeart}}));
  // scramble: most rocks start turned the wrong way
  tiles.flat().forEach(t=>{const p=period(t.base);if(p>1&&r()<scr){t.turns=1+Math.floor(r()*(p-1));t.shown=t.turns}});
  par=tiles.flat().reduce((s,t)=>{const p=period(t.base);return s+(p-t.turns%p)%p},0);
  par+=Math.ceil(n/2);moves=0;hinted.clear();
  computeLit(true);
  if(lit.size===n*n){const t=tiles.flat().find(t=>period(t.base)>1);t.turns++;t.shown=t.turns;par++;computeLit(true)}
}
function computeLit(silent){
  const s=new Set([heart+""]),q=[heart];
  while(q.length){const[x,y]=q.shift(),mk=maskOf(tileAt(x,y));DIRS.forEach(([dx,dy],i)=>{const a=x+dx,b=y+dy;if(a<0||b<0||a>=N||b>=N||s.has(a+","+b))return;
    if(mk>>i&1&&maskOf(tileAt(a,b))>>((i+2)%4)&1){s.add(a+","+b);q.push([a,b])}})}
  const now=performance.now(),fresh=[...s].filter(k=>!lit.has(k));lit=s;
  if(!silent&&fresh.length){fresh.forEach((k,j)=>{litAt.set(k,now+j*45);const[x,y]=k.split(",").map(Number);if(tileAt(x,y).gem>=0)setTimeout(()=>{sound.tink(.6);haptic.tick()},j*45+80)});sound.flow(fresh.length)}
  renderGoals();
  return fresh.length;
}
const solved=()=>lit.size===N*N;

// ---------- chambers, the daily and endless ----------
let lvl=store.level||1;
const roman=n=>{const v=[[1000,"M"],[900,"CM"],[500,"D"],[400,"CD"],[100,"C"],[90,"XC"],[50,"L"],[40,"XL"],[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const[a,b]of v)while(n>=a){r+=b;n-=a}return r};
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dailyNo=()=>Math.floor((Date.parse(todayKey()+"T12:00:00")-Date.parse("2026-10-01T12:00:00"))/864e5)+1;
const seeded=seed=>{let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}};
let mode=['endless','daily'].includes(store.mode)?store.mode:'chambers';
// a gentle ramp: tiny caverns first, fewer rocks turned wrong, and long winding veins with few forks early on
const sizeFor=l=>l<=2?3:l<=5?4:l<=10?5:l<=20?6:7;
const scrambleFor=l=>l<=2?.45:l<=5?.6:l<=10?.75:.85;
const windFor=l=>l<=5?.9:l<=10?.75:.55;
function palette(k,r){return[0,1,2,3,4,5].sort(()=>r()-.5).slice(0,k)}
function newGame(){

  let r;
  if(mode==="daily"){const d=dailyNo();r=seeded(d*2654435761);genCavern(5,palette(3,r),r,.75,.75)}
  else if(mode==="endless"){r=Math.random;genCavern(r()<.5?5:6,palette(4,r),r,.8,.7)}
  else{r=seeded(lvl*7919+3);genCavern(sizeFor(lvl),palette(lvl<3?2:lvl<8?3:4,r),r,scrambleFor(lvl),windFor(lvl))}
  layout();renderGoals();updStat();
  $("foot").textContent=mode==="daily"?(store.daily&&store.daily[todayKey()]?"You already solved today's cavern. Replays don't change your result.":"Today's cavern is the same for everyone. Fewest turns wins."):
    mode==="endless"?"Endless caverns. No turn count, just the glow.":lvl===1&&!store.tutored?"Tap a rock to turn it. Join every gem to the dragon's heart.":"Turn the rocks so one ember vein joins the dragon's heart to every gem.";
  boostUI();
}
function updStat(){
  if(mode==="endless"){$("statLbl").textContent="Solved";$("moves").textContent=(store.caverns||0).toLocaleString();$("chamber").textContent="Endless"}
  else{$("statLbl").textContent="Turns";$("moves").textContent=moves;$("chamber").textContent=mode==="daily"?`Daily #${dailyNo()}`:`Chamber ${roman(lvl)}`}
}
function renderGoals(){
  const by_={};tiles.flat().forEach((t,i)=>{if(t.gem<0)return;const k=t.gem;by_[k]=by_[k]||{need:0,got:0};by_[k].need++;const x=i%N,y=Math.floor(i/N);if(lit.has(x+","+y))by_[k].got++});
  $("goals").innerHTML=Object.entries(by_).map(([g,q])=>{const c=GEMS[g].c;return`<span class="goal${q.got>=q.need?" done":""}" title="${GEMS[g].n}"><i style="background:linear-gradient(135deg,${c[1]},${c[0]} 50%,${c[2]})"></i><b>${q.got}</b><small>/ ${q.need}</small></span>`}).join("");
}
function finish(){
  over=true;aiming=false;const now=performance.now();contentUntil=now+4000;haptic.success();sound.done(3);
  const gemsLit=tiles.flat().filter(t=>t.gem>=0);
  // every gem sends a spark along the vein to the dragon
  if(!reduced)gemsLit.forEach((t,j)=>{const i=tiles.flat().indexOf(t),x=i%N,y=Math.floor(i/N);for(let k=0;k<6;k++)particles.push({x:bx+(x+.5)*cell,y:by+(y+.5)*cell,vx:(Math.random()-.5)*6,vy:-Math.random()*5-2,s:U*(.08+Math.random()*.1),c:GEMS[t.gem].c[1],life:60+Math.random()*40,rot:Math.random()*6,vr:(Math.random()-.5)*.3})});
  hoard(N*N);

}
function showDone(){

  if(mode==="endless"){
    store.caverns=(store.caverns||0)+1;const gift=store.caverns%3===0?3:0;store.embers=(store.embers||0)+gift;store.best=Math.max(store.best||0,store.caverns);save();gc.submit(LB.endless,store.caverns);updStat();
    v.innerHTML=`<div class="card"><h2>The cavern glows</h2><div class="big">${store.caverns.toLocaleString()}</div><p>caverns lit in Endless</p>${gift?`<p class="gift">+${gift} ✦ embers</p>`:""}<div class="row"><button class="ghost" id="share" type="button">Share</button><button id="nextc" type="button">Next cavern</button></div></div>`;
    $("share").onclick=()=>shareText(`I've lit ${store.caverns} caverns in Embergem 🐉🔥 Can you light more?`);
    $("nextc").onclick=()=>monet.between(newGame);return}
  const stars=moves<=par?3:moves<=Math.ceil(par*1.5)?2:1;let gift=2+stars*2;
  if(mode==="daily"){store.daily=store.daily||{};const k=todayKey();if(!store.daily[k]){store.daily[k]={moves,stars};gift=6+stars*3;gc.submit(LB.daily,moves)}else gift=0}
  else{store.stars=store.stars||{};store.stars[lvl]=Math.max(store.stars[lvl]||0,stars);store.level=Math.max(store.level||1,lvl+1);gc.submit(LB.chambers,lvl)}
  store.embers=(store.embers||0)+gift;save();boostUI();
  v.innerHTML=`<div class="card"><h2>${mode==="daily"?`Daily #${dailyNo()} lit`:`Chamber ${roman(lvl)} lit`}</h2><div class="stars" aria-label="${stars} of 3 stars">${[0,1,2].map(i=>`<i class="${i<stars?"on":""}">★</i>`).join("")}</div>
    <p>${moves} turns${stars<3?` · ${par} or fewer for three stars`:" · the dragon purrs"}</p>${gift?`<p class="gift">+${gift} ✦ embers</p>`:""}
    ${mode==="daily"?`<div class="row"><button class="ghost" id="shareD" type="button">Share</button><button id="nextc" type="button">Back to chambers</button></div>`:`<div class="row"><button class="ghost" id="again" type="button">Replay</button><button id="nextc" type="button">Next chamber</button></div>`}</div>`;
  if(mode==="daily"){const r=store.daily[todayKey()];$("shareD").onclick=()=>shareText(`Embergem Daily #${dailyNo()} 🐉\n${"🔥".repeat(r.stars)}${"🖤".repeat(3-r.stars)}  ${r.moves} turns`);$("nextc").onclick=()=>monet.between(()=>setMode("chambers"));return}

function shareText(text){

  if(S&&S.share)S.share({text,dialogTitle:"Share"}).catch(()=>{});
  else if(navigator.share)navigator.share({text}).catch(()=>{});
  else{try{navigator.clipboard.writeText(text);$("foot").textContent="Copied. Paste it anywhere."}catch(e){}}
}

// ---------- turning rocks ----------
function turn(x,y,by1=1){const t=tileAt(x,y);if(period(t.base)===1){sound.thunk();return}
  t.turns+=by1;if(mode!=="endless")moves+=by1;sound.grind();haptic.tap();updStat();
  computeLit(false);if(solved())finish();boostUI()}
function correct(x,y){const t=tileAt(x,y),p=period(t.base),need=(p-t.turns%p)%p;if(!need)return false;t.turns+=need;hinted.set(x+","+y,performance.now());return true}
function needsTurn(t){const p=period(t.base);return t.turns%p!==0}

// ---------- the dragon stirs as the vein spreads ----------
function stepDragon(now){
  const frac=lit.size/(N*N||1),target=now<contentUntil?.75:.12*frac*frac;
  eyeO+=(target-eyeO)*.04;
  if(now>nextBreath){sound.breath(eyeO);nextBreath=now+4600}
}

function render(now){

// first chamber: a soft ring pulses on a rock that needs turning
function drawTutorial(now){
  if(store.tutored||over||mode!=="chambers"||moves>2)return;
  let best=null;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tileAt(x,y);if(!needsTurn(t))continue;const d=Math.abs(x-heart[0])+Math.abs(y-heart[1]);if(!best||d<best.d)best={x,y,d}}
  if(!best)return;const k=(now%1600)/1600,X=bx+(best.x+.5)*cell,Y=by+(best.y+.5)*cell;
  ctx.save();ctx.globalAlpha=.8*(1-k);ctx.strokeStyle="#f1dcae";ctx.lineWidth=2;ctx.shadowColor="#f1dcae";ctx.shadowBlur=12;ctx.beginPath();ctx.arc(X,Y,cell*(.25+.25*k),0,Math.PI*2);ctx.stroke();ctx.restore();

// ---------- input ----------
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener("pointerdown",haptic.during(e=>{
  sound.wake();if(over)return;const p=pt(e),x=Math.floor((p.x-bx)/cell),y=Math.floor((p.y-by)/cell);
  if(x<0||y<0||x>=N||y>=N)return;
  if(aiming){if(!spend(6))return;aiming=false;let n=0;for(let j=y-1;j<=y+1;j++)for(let i=x-1;i<=x+1;i++)if(i>=0&&j>=0&&i<N&&j<N&&correct(i,j))n++;
    sound.vein();haptic.burst();shake=3;$("foot").textContent=n?"The claw sets the rocks around it.":"Those rocks were already right.";computeLit(false);if(solved())finish();boostUI();return}
  turn(x,y);
}));

// ---------- the dragon coiled around the hoard ----------
let eyeO=0,nextBreath=0,smoke=[],contentUntil=0;
function ringPoints(){
  const c=U,off=c*.38,x0=bx-off,y0=by-off,w=c*8+2*off,h=w,rc=c*.95,cx=x0+w/2,pts=[],st=c*.06;
  const line=(ax,ay,bx2,by2)=>{const l=Math.hypot(bx2-ax,by2-ay),n=Math.max(1,Math.round(l/st));for(let i=0;i<n;i++)pts.push([ax+(bx2-ax)*i/n,ay+(by2-ay)*i/n])};
  const arc=(ax,ay,r,a0,a1)=>{const n=Math.max(2,Math.round(Math.abs(a1-a0)*r/st));for(let i=0;i<n;i++){const a=a0+(a1-a0)*i/n;pts.push([ax+Math.cos(a)*r,ay+Math.sin(a)*r])}};
  arc(cx+c*.5,y0-c*.02,c*.5,Math.PI,Math.PI*.5+Math.PI*.0); // neck curling down from the head
  line(cx+c*.5,y0+c*.48-c*.5,x0+w-rc,y0);
  arc(x0+w-rc,y0+rc,rc,-Math.PI/2,0);line(x0+w,y0+rc,x0+w,y0+h-rc);
  arc(x0+w-rc,y0+h-rc,rc,0,Math.PI/2);line(x0+w-rc,y0+h,x0+rc,y0+h);
  arc(x0+rc,y0+h-rc,rc,Math.PI/2,Math.PI);line(x0,y0+h-rc,x0,y0+rc);
  arc(x0+rc,y0+rc,rc,Math.PI,Math.PI*1.5);line(x0+rc,y0,cx-c*.75,y0);
  arc(cx-c*.75,y0+c*.28,c*.28,-Math.PI/2,-Math.PI*.05); // tail tip curling under the head
  return pts;
}
let RING=null,dragonHead=null;
const AGES=[
  {name:"a hatchling",at:0,deep:"#0e0c12",mid:"#221e2a",head:"#3b3446",scale:.22,glow:null},
  {name:"a wyrmling",at:300,deep:"#120c12",mid:"#2a1f2e",head:"#463a4f",scale:.3,glow:null},
  {name:"a young ember-wyrm",at:1000,deep:"#140a0c",mid:"#2e1a1c",head:"#52323a",scale:.38,glow:"rgba(255,120,60,.22)"},
  {name:"a bronze drake",at:2500,deep:"#150f0a",mid:"#33261a",head:"#5c4630",scale:.5,glow:"rgba(255,150,70,.3)"},
  {name:"an elder flame",at:5000,deep:"#16080a",mid:"#3a1418",head:"#6a2a2c",scale:.6,glow:"rgba(255,90,50,.4)"},
  {name:"an ancient gold wyrm",at:10000,deep:"#1a140a",mid:"#4a3a1c",head:"#8a6c34",scale:.75,glow:"rgba(255,210,120,.5)"}];
function dragonStage(){const t=store.hoardTotal||0;let i=0;AGES.forEach((a,k)=>{if(t>=a.at)i=k});const n=AGES[i+1];return{...AGES[i],i,next:n?n.at-t:0}}
function hoard(n){
  const before=dragonStage().i;store.hoardTotal=(store.hoardTotal||0)+n;save();const st=dragonStage();
  if(st.i>before)setTimeout(()=>{const tn=performance.now();texts.push({s:"Your dragon grew",x:W/2,y:by+U*1.3,t:tn,size:Math.min(W*.06,26)});texts.push({s:st.name.replace(/^an? /,""),x:W/2,y:by+U*2,t:tn,size:Math.min(W*.045,19)});sound.done(3);haptic.success();
    if(!reduced)for(let j=0;j<70;j++)particles.push({x:W/2,y:by-U*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*6,s:U*(.08+Math.random()*.1),c:st.glow?"#ffb46a":"#c8a76a",life:80+Math.random()*30,rot:Math.random()*6,vr:(Math.random()-.5)*.3})},900);
}
function drawDragon(now){
  if(!RING)RING=ringPoints();const D=dragonStage();
  const c=U,n=RING.length,cxB=bx+c*8/2,cyB=by+c*8/2;
  const rate=.0016+.0022*eyeO,breath=1+(.025+.03*eyeO)*Math.sin(now*rate);

    flow(n){for(let i=0;i<Math.min(n,7);i++)tone(S[Math.min(S.length-1,2+i)],1.1,.045,"sine",i*.05)},
    snap(w){const n=w.rows.length+w.cols.length;tone(n?880:1320,.05,.025,"sine");if(n)tone(1318.5,.18,.02,"sine",.02)},
    pop(j,pure){tone(S[Math.min(S.length-1,3+j%9)]*(pure?2:1),.5,.035,"sine")},
    tink(r){tone(1046.5+r*700,.25,.04,"triangle");tone(2093+r*900,.12,.012,"sine",.015)},
    vein(){[0,2,4,6,8,10,12].forEach((k,i)=>tone(S[k],2,.06,"sine",.1+i*.07))},
    end(){[440,349.23,293.66,220].forEach((f,i)=>tone(f,1.6,.07,"triangle",i*.18))}};
})();


// phones only allow audio once a tap has unlocked it; also ask iOS to play through the silent switch
["pointerdown","touchend","click","keydown"].forEach(ev=>addEventListener(ev,()=>sound.unlock(),{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sound.unlock()});
addEventListener("resize",layout);
applySkin();layout();newGame();requestAnimationFrame(render);monet.start();dailyGift();gc.start();
</script>
