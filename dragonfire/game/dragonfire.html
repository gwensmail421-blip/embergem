<style>
/* Layout: one dark screen. Gem goals above, the crystal chamber with its dragons as the hero, boosts below. */
:root{

  color-scheme:dark;

html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--body);overflow:hidden;
  background-image:radial-gradient(ellipse at 50% 40%,#1a1a2a 0%,var(--void) 68%)}
[hidden]{display:none!important}
.app{height:100%;padding-top:max(12px,env(safe-area-inset-top))!important;padding-bottom:max(12px,env(safe-area-inset-bottom))!important;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:8px}
header{width:100%;max-width:460px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.brand{font-family:var(--display);color:var(--gold);letter-spacing:.08em;font-size:11px;align-self:center}
.chamber{text-align:center;font-family:var(--display);font-size:clamp(21px,6.2vw,30px);padding-inline:6px;line-height:1;color:var(--bone)}
.goals{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;min-height:26px}
.goal{display:flex;align-items:center;gap:6px;font-size:19px;font-variant-numeric:tabular-nums;color:var(--bone);transition:opacity .4s}
.goal i{width:18px;height:18px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(241,220,174,.3)}
.goal small{color:var(--mist);font-size:15px}
.goal.done{opacity:.45}
.goal.done b::after{content:" ✓";color:var(--gold)}
.goal.bump b{animation:gb .4s}
@keyframes gb{40%{color:var(--gold-hi);text-shadow:0 0 10px var(--gold)}}
.stars{font-size:34px;letter-spacing:.2em;color:var(--gold)}
.stars i{font-style:normal;opacity:.22}
.stars i.on{opacity:1}
.best{justify-self:end;text-align:right;color:var(--mist);font-size:15px;font-variant-numeric:tabular-nums;line-height:1.1}
.best b{display:block;color:var(--gold);font-weight:600;font-size:18px}
.stage{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
canvas{touch-action:none;display:block;max-width:100%}
.foot{color:var(--mist);font-style:italic;font-size:16px;min-height:1.3em;text-align:center}
button{font-family:var(--display);font-size:15px;letter-spacing:.12em;color:var(--void);background:var(--gold);border:0;border-radius:999px;padding:10px 22px;cursor:pointer}
button.ghost{background:transparent;color:var(--bone);border:1px solid var(--rim)}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.veil{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding-inline:16px;background:color-mix(in srgb,var(--void) 92%,transparent);animation:fade .8s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:360px}
.card h2{font-family:var(--display);font-weight:400;color:var(--gold);font-size:28px;margin:0;letter-spacing:.06em}
.card .big{font-family:var(--display);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.card p{margin:0;color:var(--mist);font-size:17px}
.card p.gift{color:var(--gold-hi);font-style:italic}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button.ghost{padding:10px 16px}
button.mode{display:flex;flex-direction:column;gap:2px;align-items:center;padding:12px 16px;border-radius:16px;background:rgba(241,220,174,.06);border:1px solid var(--rim);color:var(--bone);font-family:var(--display);font-size:20px;letter-spacing:.06em}
button.mode small{font-family:var(--body);font-style:italic;font-size:14px;color:var(--mist);letter-spacing:0}
.card p.age{font-style:italic;font-size:15px}
.skins{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.skin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;background:none;border:1px solid var(--rim);color:var(--bone);font-family:var(--body);font-size:13px;min-width:62px}
.skin.on{border-color:var(--gold);box-shadow:0 0 10px rgba(200,167,106,.45)}
.skin .sw{display:flex;gap:2px}.skin .sw i{width:9px;height:14px;border-radius:2px;display:block}
.skin small{color:var(--gold);font-size:12px}
.boosts{display:flex;gap:8px;justify-content:center}
.boost{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;padding:6px 8px;border-radius:14px;background:rgba(241,220,174,.06);border:1px solid var(--rim);color:var(--bone);font-family:var(--body);font-size:14px;letter-spacing:.02em}
.boost span{font-size:18px;line-height:1;color:var(--gold)}
.boost small{color:var(--gold);font-size:12px}.boost small::before{content:"✦ "}
.boost.wallet b{color:var(--gold-hi);font-size:17px;font-weight:600}.boost.wallet small::before{content:""}
.boost.on{border-color:var(--gold);box-shadow:0 0 12px rgba(200,167,106,.5)}
.boost:disabled{opacity:.35}
.col{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:240px}
.card.col h2{margin-bottom:6px}
button.link{background:none;border:0;color:var(--gold);font-family:var(--body);font-style:italic;font-size:17px;letter-spacing:.02em;padding:6px 10px}
button:disabled{opacity:.45}
.nudge{animation:glow 2.4s ease-in-out infinite;margin-bottom:-4px}@keyframes glow{50%{text-shadow:0 0 12px var(--gold);color:var(--gold-hi)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>

 {n:"garnet",c:["#8c1d3c","#e0587c","#3d0a1a"]},

  bloodmoon:{name:"Blood Moon",cost:80,c:[["#7a0f14","#ff4a3d","#2a0405"],["#5c1730","#e0628a","#1f060f"],["#7a3a12","#ff9a4a","#2a1205"],["#3d0d0d","#a8433a","#140303"],["#8a6a1a","#ffd36a","#2e2306"],["#4a3a40","#c9a8b0","#1a1316"]]},

}

// ---------- haptics ----------

// ---------- the chamber: turn crystals so the dragon's fire bends through every gem socket ----------
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]]; // N E S W as [dx,dy]
// a crystal set "/" (m=0) or "\" (m=1) turns the fire a quarter turn

// follow one dragon's fire; points are in cell units, cells remember which point they sit on
function trace(d){
  let x=d.x,y=d.y,dx=d.dx,dy=d.dy;const pts=[[x+.5+dx*.5,y+.5+dy*.5]],cells=[],seen=new Set();
  for(let i=0;i<4*N*N;i++){x+=dx;y+=dy;

// Build a chamber backwards from its answer: each dragon's fire wanders the board, crystals are set where it turns,
// gem sockets go on the fire after its first turn, then spare crystals and pillars fill the rest and the crystals are scrambled.
function genChamber(n,nd,ng,colors,r){
  N=n;multi=nd>1;
  for(let tries=0;tries<900;tries++){

        c.paths.push([d,len,turns]);since++;
      }
      if(!ok||turns<minT||len<n+1){ok=false;break}
      D.turns=turns;dragons.push(D);
    }
    if(!ok)continue;
    // gem sockets: only on fire that has already turned, always including the end of each dragon's path
    const cand=new Map();
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=grid[y][x];if(c.k)continue;c.paths.forEach(([d,len,t])=>{if(t>=1&&!cand.has(x+","+y))cand.set(x+","+y,{x,y,d,len,t})})}
    if(cand.size<ng)continue;
    const list=[...cand.values()],pick=[];
    dragons.forEach((D,d)=>{const mine=list.filter(o=>o.d===d&&o.t===D.turns).sort((a,b)=>b.len-a.len);if(mine[0])pick.push(mine[0])});
    const rest=list.filter(o=>!pick.includes(o));for(let i=rest.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
    // spread them out: skip sockets touching one already chosen while there are other options
    for(const o of rest){if(pick.length>=ng)break;if(pick.some(q=>Math.abs(q.x-o.x)+Math.abs(q.y-o.y)<2)&&rest.length-pick.length>ng)continue;pick.push(o)}
    for(const o of rest){if(pick.length>=ng)break;if(!pick.includes(o))pick.push(o)}
    if(pick.length<ng)continue;
    pick.slice(0,ng).forEach(o=>{const c=grid[o.y][o.x];c.k=2;c.need=multi?o.d:-1;c.g=multi?FIRE[o.d]:colors[Math.floor(r()*colors.length)]});
    // spare crystals and pillars where the fire never needs to go
    const spare=n<=5?.16:.22;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=grid[y][x];if(c.k||c.paths.length)continue;const q=r();
      if(q<spare){c.k=1;c.want=-1;c.m=r()<.5?0:1}else if(q<spare+.1)c.k=3}
    // scramble the crystals the answer uses
    let wrong=0;const used=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=grid[y][x];if(c.k===1&&c.want>=0){used.push(c);if(r()<.72){c.m=1-c.want;wrong++}}}
    sockets=ng;
    if(wrong<2||solved()){used.forEach(c=>{if(c.m===c.want&&wrong<2){c.m=1-c.want;wrong++}});if(solved()){used[0].m=1-used[0].m;wrong++}}
    if(solved())continue;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=grid[y][x];c.ang=c.m}
    par=wrong+1;moves=0;hinted.clear();return;
  }
}

// ---------- chambers, the daily and endless ----------
let lvl=store.level||1;

  else{r=seeded(lvl*7919+5);const n=sizeFor(lvl);genChamber(n,dragonsFor(lvl),n-1+(lvl>13?1:0),palette(lvl<3?2:4,r),r)}
  layout();dragons.forEach(d=>{d.beam=null;d.len=0});renderGoals();updStat();

// ---------- turning crystals ----------
function turn(x,y){const c=grid[y][x];if(c.k!==1){if(c.k)sound.thunk();return}
  c.m^=1;if(mode!=="endless")moves++;sound.prism();haptic.tap();updStat();boostUI()}
// the crystal the answer needs next, following each dragon's fire in order
function nextWrong(){for(const d of dragons)for(const[x,y]of d.cr){const c=grid[y][x];if(c.want>=0&&c.m!==c.want)return[x,y]}return null}
function correct(x,y){const c=grid[y][x];if(c.k!==1||c.want<0||c.m===c.want)return false;c.m=c.want;hinted.set(x+","+y,performance.now());return true}

// ---------- the dragons watch their fire ----------
function stepDragon(now){
  const lit=grid.flat().filter(c=>c.on).length,frac=lit/(sockets||1),target=now<contentUntil?.8:.15+.45*frac;
  eyeO+=(target-eyeO)*.04;
  if(now>nextBreath){sound.breath(eyeO);nextBreath=now+4600}
}
// grow each flame along its path; a turned crystal pulls the flame back to it
function stepFire(){
  dragons.forEach(d=>{const t=trace(d),o=d.beam;
    if(o){let k=0;while(k<o.pts.length&&k<t.pts.length&&o.pts[k][0]===t.pts[k][0]&&o.pts[k][1]===t.pts[k][1])k++;d.len=Math.min(d.len,Math.max(0,k-1))}
    d.beam=t;d.len=Math.min(t.pts.length-1,d.len+(reduced?99:.3))});
  const s=litSet(false),now=performance.now();let changed=false;
  grid.forEach((row,y)=>row.forEach((c,x)=>{if(c.k!==2)return;const on=s.has(x+","+y);if(on!==c.on){c.on=on;changed=true;if(on){c.at=now;sound.tink(.4+.1*(x+y)/N);haptic.tick()}}}));
  if(changed)renderGoals();
  if(!over&&s.size===sockets&&dragons.every(d=>d.beam&&d.len>=d.beam.pts.length-1))finish();
}

const fireCol=i=>GEMS[multi?FIRE[i]:FIRE[0]].c;

  ctx.save();ctx.shadowColor="rgba(0,0,0,.7)";ctx.shadowBlur=cell*.2;ctx.shadowOffsetY=cell*.06;

function drawSocket(c,x,y,now){const cx=bx+(x+.5)*cell,cy=by+(y+.5)*cell;
  ctx.beginPath();ctx.arc(cx,cy,cell*.36,0,Math.PI*2);ctx.fillStyle="#0b0a0f";ctx.fill();ctx.lineWidth=cell*.06;ctx.strokeStyle=c.on?"#8a7148":"#2e2934";ctx.stroke();

  ctx.save();ctx.globalCompositeOperation="lighter";ctx.lineCap="round";ctx.lineJoin="round";
  dragons.forEach((d,i)=>{if(!d.beam)return;const P=d.beam.pts,L=d.len,col=fireCol(i),fl=1+.08*Math.sin(now*.017+i)+.05*Math.sin(now*.041);

  });

function headSpot(d){const ux=d.dx,uy=d.dy,ex=bx+(d.x+.5+ux*.5)*cell,ey=by+(d.y+.5+uy*.5)*cell,c=W*.13*.78;return{x:ex-ux*c*.96,y:ey-uy*c*.96,a:Math.atan2(uy,ux),c}}

    flow(n){for(let i=0;i<Math.min(n,7);i++)tone(S[Math.min(S.length-1,2+i)],1.1,.045,"sine",i*.05)},
    snap(w){const n=w.rows.length+w.cols.length;tone(n?880:1320,.05,.025,"sine");if(n)tone(1318.5,.18,.02,"sine",.02)},
    pop(j,pure){tone(S[Math.min(S.length-1,3+j%9)]*(pure?2:1),.5,.035,"sine")},
    tink(r){tone(1046.5+r*700,.25,.04,"triangle");tone(2093+r*900,.12,.012,"sine",.015)},
    vein(){[0,2,4,6,8,10,12].forEach((k,i)=>tone(S[k],2,.06,"sine",.1+i*.07))},
    end(){[440,349.23,293.66,220].forEach((f,i)=>tone(f,1.6,.07,"triangle",i*.18))}};
})();


// phones only allow audio once a tap has unlocked it; also ask iOS to play through the silent switch
["pointerdown","touchend","click","keydown"].forEach(ev=>addEventListener(ev,()=>sound.unlock(),{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sound.unlock()});
addEventListener("resize",layout);
applySkin();layout();newGame();requestAnimationFrame(render);monet.start();dailyGift();gc.start();
</script>
